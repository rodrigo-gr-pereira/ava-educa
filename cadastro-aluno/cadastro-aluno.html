<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cadastrar Aluno - AVA Educa</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="cadastro-aluno.css">
</head>

<body>
  <!-- Cabeçalho -->
  <nav class="cabecalho">
    <h1>AVA-EDUCA+</h1>
  </nav>

  <!-- Menu Lateral -->
  <aside class="sidebar">
    <div>
      <nav class="sidebar-nav">
        <a href="../dashboard/dashboard.html" class="sidebar-link">
          Dashboard
        </a>
        <a href="#" class="sidebar-link disabled" tabindex="-1" aria-disabled="true">Cursos</a>
        <a href="../cadastro-aluno/cadastro-aluno.html" class="sidebar-link active">
          Cadastrar Aluno
        </a>
      </nav>
    </div>

    <div class="sidebar-footer">
      <button id="btn-logout" class="btn-logout">Sair</button>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <div class="form-card">
      <h1 class="form-title">Cadastro de Aluno</h1>
      <p class="form-subtitle">Preencha os dados abaixo para registrar um novo aluno no sistema.</p>

      <form id="form-cadastro-aluno" novalidate>

        <!-- Dados Pessoais -->
        <fieldset class="form-section">
          <legend>Dados Pessoais</legend>

          <div class="form-grid">
            <!-- Nome Completo -->
            <div class="form-group full-width">
              <label for="nome">Nome Completo <span class="required">*</span></label>
              <input type="text" id="nome" name="nome" minlength="4" maxlength="80" required
                placeholder="Ex: Maria Oliveira Silva">
              <span class="error-msg" id="err-nome"></span>
            </div>

            <!-- Gênero -->
            <div class="form-group">
              <label for="genero">Gênero <span class="required">*</span></label>
              <select id="genero" name="genero" required>
                <option value="">Selecione...</option>
                <option value="feminino">Feminino</option>
                <option value="masculino">Masculino</option>
                <option value="nao_binario">Não-binário</option>
                <option value="outro">Outro</option>
                <option value="prefiro_nao_informar">Prefiro não informar</option>
              </select>
              <span class="error-msg" id="err-genero"></span>
            </div>

            <!-- Data de Nascimento -->
            <div class="form-group">
              <label for="dataNascimento">Data de Nascimento <span class="required">*</span></label>
              <input type="text" id="dataNascimento" name="dataNascimento" placeholder="DD/MM/YYYY" maxlength="10"
                required>
              <span class="error-msg" id="err-dataNascimento"></span>
            </div>

            <!-- CPF -->
            <div class="form-group">
              <label for="cpf">CPF (somente números) <span class="required">*</span></label>
              <input type="text" id="cpf" name="cpf" maxlength="11" placeholder="Ex: 12345678901" required>
              <span class="error-msg" id="err-cpf"></span>
            </div>

            <!-- Telefone -->
            <div class="form-group">
              <label for="telefone">Telefone (somente números) <span class="required">*</span></label>
              <input type="text" id="telefone" name="telefone" maxlength="11" placeholder="Ex: 11987654321" required>
              <span class="error-msg" id="err-telefone"></span>
            </div>

            <!-- E-mail -->
            <div class="form-group full-width">
              <label for="email">E-mail <span class="required">*</span></label>
              <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
              <span class="error-msg" id="err-email"></span>
            </div>
          </div>
        </fieldset>

        <!-- Endereço -->
        <fieldset class="form-section">
          <legend>Endereço</legend>

          <div class="form-grid">
            <!-- CEP -->
            <div class="form-group">
              <label for="cep">CEP (somente números) <span class="required">*</span></label>
              <input type="text" id="cep" name="cep" maxlength="8" placeholder="Ex: 01001000" required>
              <span class="error-msg" id="err-cep"></span>
            </div>

            <!-- Logradouro -->
            <div class="form-group col-2">
              <label for="logradouro">Logradouro <span class="required">*</span></label>
              <input type="text" id="logradouro" name="logradouro" placeholder="Ex: Rua das Flores" required>
              <span class="error-msg" id="err-logradouro"></span>
            </div>

            <!-- Número -->
            <div class="form-group">
              <label for="numero">Número <span class="required">*</span></label>
              <input type="text" id="numero" name="numero" placeholder="Ex: 123" required>
              <span class="error-msg" id="err-numero"></span>
            </div>

            <!-- Complemento -->
            <div class="form-group">
              <label for="complemento">Complemento <span class="optional">(Opcional)</span></label>
              <input type="text" id="complemento" name="complemento" placeholder="Ex: Apto 42, Bloco B">
              <span class="error-msg" id="err-complemento"></span>
            </div>

            <!-- Bairro -->
            <div class="form-group">
              <label for="bairro">Bairro <span class="required">*</span></label>
              <input type="text" id="bairro" name="bairro" placeholder="Ex: Centro" required>
              <span class="error-msg" id="err-bairro"></span>
            </div>

            <!-- Cidade -->
            <div class="form-group">
              <label for="cidade">Cidade <span class="required">*</span></label>
              <input type="text" id="cidade" name="cidade" placeholder="Ex: São Paulo" required>
              <span class="error-msg" id="err-cidade"></span>
            </div>

            <!-- Estado -->
            <div class="form-group">
              <label for="estado">Estado (UF) <span class="required">*</span></label>
              <input type="text" id="estado" name="estado" maxlength="2" placeholder="Ex: SP"
                style="text-transform: uppercase;" required>
              <span class="error-msg" id="err-estado"></span>
            </div>
          </div>
        </fieldset>

        <!-- Ações -->
        <div class="form-actions">
          <button type="submit" class="btn-primary btn-save">Salvar</button>
        </div>

      </form>
    </div>
    </div>
  </main>



  <script type="module" src="cadastro-aluno.js"></script>
</body>

</html>
