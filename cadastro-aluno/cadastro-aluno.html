<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Alunos - AVA Educa</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="cadastro-aluno.css">


  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="../dados/listagem-alunos.js" defer></script> <!-- Carrega o array 'listagemAlunos' primeiro -->

  <!-- Scripts de Lógica e Modelos -->
  <script src="../js/app.js" defer></script>
  <script src="../js/Aluno.js" defer></script> <!-- Classe Aluno -->
  <script src="../js/alunos.js" defer></script> <!-- Função cadastrarAluno -->
  <script src="cadastro-aluno.js" defer></script> <!-- Controlador da tela -->
</head>

<body>
  <header class="main-header">
    <div class="system-name">AVA-EDUCA+</div>
    <div class="user-profile">
      <span id="headerUserName" class="user-name">Carregando...</span>
    </div>
  </header>

  <aside>
    <nav class="sidebar">
      <!-- Caminhos relativos partindo de /dashboard ou /cadastro-aluno -->
      <a href="../dashboard/dashboard.html" class="nav-btn">Dashboard</a>

      <!-- Botão desabilitado conforme requisito -->
      <button class="nav-btn" disabled>Cursos</button>

      <a href="../cadastro-aluno/cadastro-aluno.html" class="nav-btn">Cadastro de Alunos</a>

      <!-- Botão de Sair com ID para capturar o clique no JS -->
      <button id="btnSair" class="nav-btn nav-btn-exit">Sair</button>
    </nav>
  </aside>

  <main class="dashboard-content">
    <h1>Cadastro de Aluno</h1>
    <p class="subtitle">Preencha todas as informações obrigatórias para registrar um novo estudante.</p>

    <div id="feedbackMessage" class="feedback-banner" style="display: none;"></div>

    <form id="formCadastroAluno" class="student-form" novalidate>
      <fieldset>
        <legend>Dados Pessoais</legend>

        <div class="form-group">
          <label for="nomeCompleto">Nome Completo *</label>
          <input type="text" id="nomeCompleto" required minlength="4" maxlength="80"
            placeholder="Digite o nome completo">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="genero">Gênero *</label>
            <select id="genero" required>
              <option value="" disabled selected>Selecione o gênero...</option>
              <option value="Masculino">Masculino</option>
              <option value="Feminino">Feminino</option>
              <option value="Outro">Outro</option>
              <option value="Não informado">Prefiro não responder</option>
            </select>
          </div>

          <div class="form-group">
            <label for="dataNascimento">Data de Nascimento *</label>
            <input type="date" id="dataNascimento" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF (Apenas números) *</label>
            <input type="number" id="cpf" required placeholder="00000000000">
          </div>

          <div class="form-group">
            <label for="telefone">Telefone (Apenas números) *</label>
            <input type="number" id="telefone" required placeholder="DDD999999999">
          </div>
        </div>

        <div class="form-group">
          <label for="email">E-mail *</label>
          <input type="email" id="email" required placeholder="exemplo@email.com">
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <div class="form-row">
          <div class="form-group">
            <label for="cep">CEP (Apenas números) *</label>
            <input type="number" id="cep" required placeholder="00000000">
          </div>
          <div class="form-group flex-2">
            <label for="logradouro">Logradouro *</label>
            <input type="text" id="logradouro" required placeholder="Rua, Avenida, etc.">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="numero">Número *</label>
            <input type="number" id="numero" required placeholder="123">
          </div>
          <div class="form-group flex-2">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" placeholder="Apto, Bloco, Casa (Opcional)">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bairro">Bairro *</label>
            <input type="text" id="bairro" required placeholder="Bairro">
          </div>
          <div class="form-group">
            <label for="cidade">Cidade *</label>
            <input type="text" id="cidade" required placeholder="Cidade">
          </div>
          <div class="form-group">
            <label for="estado">Estado *</label>
            <input type="text" id="estado" required placeholder="Estado">
          </div>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="submit" id="btnSalvar" class="btn-primary">Salvar</button>
      </div>
    </form>
  </main>
</body>

</html>
