<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cadastrar Aluno - AVA Educa</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="cadastro-aluno.css">
</head>

<body>
  <div class="form-card">
    <h2>Cadastrar Novo Aluno</h2>
    <form id="form-cadastro" style="margin-top: 1.5rem;">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" required>
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="curso">Curso</label>
        <select id="curso" required></select>
      </div>
      <button type="submit" class="btn-primary">Salvar Aluno</button>
      <a href="../dashboard/dashboard.html" style="margin-left: 10px;">Cancelar</a>
    </form>
  </div>

  <script type="module" src="cadastro-aluno.js"></script>
</body>

</html>
