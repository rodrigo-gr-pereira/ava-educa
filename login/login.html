<!-- login/login.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVA-EDUCA - Login</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="login-container">
    <form id="login-form">
      <h2>Acessar AVA-EDUCA</h2>

      <!-- Mensagem de erro oculta por padrão -->
      <div id="error-message" class="error-box hidden">
        Email ou senha incorretos. Tente novamente.
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>

      <div class="input-group">
        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="Sua senha">
      </div>

      <button type="submit" id="btn-entrar">Entrar</button>

      <a href="#" id="forgot-password">Esqueceu sua senha?</a>
    </form>
  </div>

  <!-- Importação dos scripts na ordem correta -->
  <script src="../js/auth.js"></script>
  <script src="login.js"></script>
</body>

</html>
