<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AVA Educa</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="login-container">
    <form id="loginForm">
      <h2>Acessar AVA Educa</h2>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="Digite seu e-mail">
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="Digite sua senha">
      </div>

      <!-- Feedback visual de erro oculto por padrão -->
      <div id="errorMessage" class="error-message hidden">
        E-mail ou senha incorretos. Tente novamente.
      </div>

      <button type="submit" id="btnEntrar">Entrar</button>

      <a href="#" id="linkEsqueceuSenha">Esqueceu sua senha?</a>
    </form>
  </div>

  <!-- Scripts necessários para a autenticação -->
  <script src="../dados/listagem-usuarios.js"></script>
  <script src="../js/auth.js"></script>
  <script src="login.js"></script>
</body>

</html>
