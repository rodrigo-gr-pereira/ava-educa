<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <!-- Volta uma pasta para achar a pasta css -->
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="login-container">
    <h2>Efetuar Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Senha:</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" id="btnEntrar">Entrar</button>
    </form>
    <br>
    <a href="#" id="forgotPassword">Esqueceu sua senha?</a>
    <div id="feedbackErro" class="error-message">Usuário ou senha inválidos.</div>
  </div>

  <!-- Volta uma pasta para achar o auth.js e o app.js dentro de js/ -->
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
