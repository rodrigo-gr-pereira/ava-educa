<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Login - AVA Educa</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <h2>AVA Educa</h2>
      <p style="margin-bottom: 1.5rem; color: #666;">Acesse sua conta</p>

      <div id="erro-container" class="erro-msg" hidden></div>

      <form id="form-login" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="Digite seu e-mail">
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="Digite sua senha">
        </div>

        <div class="form-password-dead">
          <a href="#" id="link-recuperar-senha" class="link-esqueci-senha">Esqueceu a senha?</a>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Entrar</button>
      </form>
    </div>
  </div>
  <script type="module" src="login.js"></script>
</body>

</html>
